---
name: boarding-pass-service

services:
  server:
    build:
      context: ./
      dockerfile: Dockerfile
      # host network during build, otherwise pip cannot resolve pypi.org, see the dns note below
      network: host
    volumes:
      - .:/workspace:cached
    command: ["/app/env/bin/gunicorn", "--config", "/app/conf/gunicorn.conf.py", "boarding_pass_service.main:app"]
    ports:
      # override with APP_PORT if something else already listens on 8000
      - "${APP_PORT:-8000}:8000"
    # the host resolv.conf points at a systemd-resolved stub plus internal resolvers, which docker
    # cannot use, so public resolvers are pinned here; service names (db) still go through docker's
    # own resolver at 127.0.0.11
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data-local:/var/lib/postgresql/data
      - ./sql/:/docker-entrypoint-initdb.d/
    environment:
      - POSTGRES_USER=boarding_pass
      - POSTGRES_PASSWORD=boarding_pass
      - POSTGRES_DB=boarding_pass
      - PGPORT=9433
    ports:
      - "${DB_PORT:-9433}:9433"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boarding_pass -d boarding_pass -p 9433"]
      interval: 3s
      timeout: 3s
      retries: 20

# to preserve db data between builds
volumes:
  postgres-data-local:
