---
# own project name, so running the tests does not touch the dev stack or its db volume
name: boarding-pass-service-test

services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
      network: host
    command: ["/app/env/bin/gunicorn", "--config", "/app/conf/gunicorn.conf.py", "boarding_pass_service.main:app"]
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
  db:
    # no named volume here on purpose, test data is throwaway
    image: postgres:16
    restart: unless-stopped
    volumes:
      - ./sql/:/docker-entrypoint-initdb.d/
    environment:
      - POSTGRES_USER=boarding_pass
      - POSTGRES_PASSWORD=boarding_pass
      - POSTGRES_DB=boarding_pass
      - PGPORT=9433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boarding_pass -d boarding_pass -p 9433"]
      interval: 3s
      timeout: 3s
      retries: 20
  test:
    build:
      context: ./
      dockerfile: Dockerfile.test
      network: host
    environment:
      - DB_HOST=db
      - DB_PASSWORD=boarding_pass
      - DB_MASTER_NAME=boarding_pass
      - DB_SLAVE_NAME=boarding_pass
      - DB_USER=boarding_pass
      - DB_MASTER_PORT=9433
      - DB_SLAVE_PORT=9433
      - DB_APP_NAME=boarding_pass
      - TEST_API_URL=http://app:8000
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    command: ["/app/env/bin/python3", "-m", "pytest", "-v", "tests"]
