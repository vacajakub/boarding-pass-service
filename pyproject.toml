[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]
exclude = '''
/(
  \.toml
  |\.sh
  |\.git
  |\.ini
  |\.venv
  |Dockerfile
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_local_folder = ["boarding_pass_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
