---
services:
  server:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - CONFFILE=/workspace/conf/boarding-pass-service.env
    network_mode: service:db
  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../sql/:/docker-entrypoint-initdb.d/
    environment:
      - POSTGRES_USER=boarding_pass
      - POSTGRES_PASSWORD=boarding_pass
      - POSTGRES_DB=boarding_pass
      - PGPORT=9433

# to preserve db data between builds
volumes:
  postgres-data:
