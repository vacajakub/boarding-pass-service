---
services:
  server:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - CONFFILE=/workspace/conf/boarding-pass-service.env
    network_mode: service:db
  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../sql/:/docker-entrypoint-initdb.d/
    environment:
      - POSTGRES_USER=boarding_pass
      - POSTGRES_PASSWORD=boarding_pass
      - POSTGRES_DB=boarding_pass
      - PGPORT=9433

  redis:
    # cache only, deliberately no volume - losing it on restart is the point of a cache
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

# to preserve db data between builds
volumes:
  postgres-data:
